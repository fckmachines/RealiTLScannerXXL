name: Test and release (Linux AMD64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realitlscanner-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate installer
        run: |
          bash -n install.sh
          bash install.sh --help >/dev/null

      - name: Unit tests
        run: cargo test --locked

      - name: Build Linux AMD64
        run: cargo build --release --locked

      - name: Smoke test binary
        run: |
          set -euo pipefail
          ./target/release/realitlscanner --version
          ./target/release/realitlscanner --help >/dev/null
          # Exercise FAST -> DEEP wiring deterministically without raw sockets,
          # privileges, real scans or a dependency on masscan in CI.
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          cat > "$temp/masscan" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          output=""
          input=""
          port=""
          while (( $# )); do
            case "$1" in
              -iL) input="$2"; shift 2 ;;
              -oL) output="$2"; shift 2 ;;
              -p) port="$2"; shift 2 ;;
              --rate|--wait) shift 2 ;;
              *) echo "Unexpected masscan arg: $1" >&2; exit 2 ;;
            esac
          done
          [[ -f "$input" && "$port" == 443 && -n "$output" ]]
          grep -Fxq '192.0.2.1' "$input"
          if [[ "$output" == "-" ]]; then
            printf 'open tcp 443 192.0.2.1 1700000000\n'
          else
            printf 'open tcp 443 192.0.2.1 1700000000\n' > "$output"
          fi
          if [[ "${FAKE_MASSCAN_HOLD:-0}" == "1" ]]; then
            touch "${FAKE_MASSCAN_MARKER:?}"
            exec sleep 30
          fi
          EOF
          chmod +x "$temp/masscan"
          PATH="$temp:$PATH" ./target/release/realitlscanner \
            --addr 192.0.2.1/32 --fast --fast-rate 100 --fast-wait 1 \
            --no-network-info --thread 2 --timeout 1 --out "$temp/scan.csv" \
            >"$temp/stdout" 2>"$temp/stderr"
          grep -Fq 'Проверено: 1' "$temp/stdout"
          grep -Fq '[FAST] Готово: 1 уникальных IP' "$temp/stderr"
          grep -Fq 'IP,ORIGIN,CERT_DOMAIN' "$temp/scan.csv"
          test ! -e "$temp/out.csv"

          # Rejected preflight must never create/truncate an existing CSV.
          probe_csv="$(mktemp)"
          printf 'KEEP_EXISTING_RESULTS' > "$probe_csv"
          if ./target/release/realitlscanner --asn INVALID-ASN \
              --no-network-info --out "$probe_csv" >/dev/null 2>&1; then
            echo "Invalid ASN unexpectedly accepted" >&2; exit 1
          fi
          test "$(cat "$probe_csv")" = "KEEP_EXISTING_RESULTS"
          rm -f "$probe_csv"

          # Synthetic interrupted FAST: the child emits one open TCP result,
          # keeps running, and the scanner receives SIGINT. No Internet probe.
          FAKE_MASSCAN_HOLD=1 FAKE_MASSCAN_MARKER="$temp/started" PATH="$temp:$PATH" \
            ./target/release/realitlscanner --addr 192.0.2.1/32 \
            --fast --no-network-info --out "$temp/partial.csv" \
            >"$temp/partial.stdout" 2>"$temp/partial.stderr" &
          fast_pid=$!
          for ((i=0;i<100;i++)); do
            [[ -f "$temp/started" ]] && break
            sleep 0.1
          done
          test -f "$temp/started"
          kill -INT "$fast_pid"
          fast_code=0
          wait "$fast_pid" || fast_code=$?
          test "$fast_code" -eq 130
          test ! -f "$temp/partial.csv"
          grep -Fq '[FAST] Прервано: 1' "$temp/partial.stderr"
          grep -Flx '192.0.2.1' "$temp"/realitlscanner-pending-*.txt

          # Synthetic interrupted DEEP, using loopback only, ensures
          # queued targets remain recoverable and CSV is flushed.
          ./target/release/realitlscanner --addr 127.0.0.0/24 \
            --no-network-info --deep-rate 1 --thread 1 --timeout 1 \
            --out "$temp/deep.csv" >"$temp/deep.stdout" \
            2>"$temp/deep.stderr" &
          deep_pid=$!
          for ((i=0;i<100;i++)); do
            [[ -f "$temp/deep.csv" ]] && break
            sleep 0.1
          done
          test -f "$temp/deep.csv"
          kill -INT "$deep_pid"
          deep_code=0
          wait "$deep_pid" || deep_code=$?
          test "$deep_code" -eq 130
          grep -Fxq 'IP,ORIGIN,CERT_DOMAIN,CERT_ISSUER,GEO_CODE' "$temp/deep.csv"
          grep -Fq 'Осталось непроверенных целей' "$temp/deep.stderr"
          grep -l '127.0.0.' "$temp"/realitlscanner-pending-*.txt

      - name: Verify real Masscan CLI parser without sending packets
        shell: bash
        run: |
          set -euo pipefail
          # The old fake executable accepted --output-flush, but actual
          # packaged Masscan 1.3.x fails on that flag. Run the *real* parser.
          sudo apt-get update -qq
          sudo apt-get install -y -qq masscan
          masscan -V
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          # Wrapper appends --echo to the exact argv assembled by the Rust
          # binary. This asks real Masscan to validate and echo config,
          # without initializing any SYN scan or transmitting packets.
          cat > "$temp/masscan" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/bin/masscan "$@" --echo
          EOF
          chmod +x "$temp/masscan"
          if ! PATH="$temp:$PATH" ./target/release/realitlscanner \
            --addr 192.0.2.1/32 --fast --fast-rate 100 --fast-wait 1 \
            --thread 1 --timeout 1 --no-network-info \
            --out "$temp/verified.csv" >"$temp/stdout" 2>"$temp/stderr"; then
            echo "Real Masscan argument check failed:" >&2
            cat "$temp/stderr" >&2
            cat "$temp/stdout" >&2
            exit 1
          fi
          # Emit diagnostic details on every failure; the temporary files
          # are removed by trap and are otherwise invisible in CI logs.
          if ! grep -Fq '[FAST] Готово: 0 уникальных IP' "$temp/stderr" \
             || ! grep -Fxq 'IP,ORIGIN,CERT_DOMAIN,CERT_ISSUER,GEO_CODE' "$temp/verified.csv" \
             || grep -Fq 'unknown config option' "$temp/stderr"; then
            echo "Masscan parser returned unexpected output:" >&2
            cat "$temp/stderr" >&2
            cat "$temp/stdout" >&2
            if [[ -f "$temp/verified.csv" ]]; then cat "$temp/verified.csv" >&2; fi
            exit 1
          fi

      - name: Publish release when version is new
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Cargo version" >&2; exit 1; }
          tag="v$version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping publication."
            exit 0
          fi

          mkdir -p dist
          install -m 755 target/release/realitlscanner dist/realitlscanner-linux-amd64
          (cd dist && sha256sum realitlscanner-linux-amd64 > SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release create "$tag" \
            dist/realitlscanner-linux-amd64 dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "RealiTLScannerXXL $tag" \
            --generate-notes
